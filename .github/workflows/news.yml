name: Esports News

on:
  schedule:
    - cron: "7,37 * * * *"   # alle 30 Minuten (zur Minute 7 und 37)
  workflow_dispatch:          # manuell starten über "Run workflow"
    inputs:
      dry_run:
        description: "Test-Modus (nichts posten)"
        type: boolean
        default: false
      test_ai:
        description: "KI-Test (zeigt Zusammenfassungen im Log, postet nichts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: News holen und posten
        env:
          LOL_WEBHOOK_URL: ${{ secrets.LOL_WEBHOOK_URL }}
          VALO_WEBHOOK_URL: ${{ secrets.VALO_WEBHOOK_URL }}
          LOL_PATCH_WEBHOOK_URL: ${{ secrets.LOL_PATCH_WEBHOOK_URL }}
          VALO_PATCH_WEBHOOK_URL: ${{ secrets.VALO_PATCH_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_bot.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.test_ai && '--test-ai' || '' }}

      - name: Gesehene Artikel speichern
        if: ${{ !inputs.dry_run && !inputs.test_ai }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "News-Status aktualisiert [skip ci]"
          # Falls inzwischen jemand Dateien hochgeladen hat: neuesten Stand holen und erneut versuchen
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::Status konnte nicht gespeichert werden"
          exit 1
